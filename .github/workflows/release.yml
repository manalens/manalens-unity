# Release on a pushed tag vX.Y.Z (CONTRIBUTING.md: bump the version and the
# CHANGELOG on main, then push the tag; this workflow makes the release).
#
# 1. verify: the tag is strict semver, its commit is on main, and the version
#    equals package.json and the top CHANGELOG.md heading.
# 2. test: the same tests as CI (ci.yml).
# 3. build: the package as a tarball in the `npm pack` layout (package/...),
#    for Package Manager > Add package from tarball. Tests~ and the repo files
#    (.github, .gitignore) are left out. Also SHA256SUMS and a build
#    provenance attestation.
# 4. release: the GitHub release with that version's CHANGELOG section as the
#    notes, and the files of step 3.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify tag and version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    env:
      TAG: ${{ github.ref_name }}
      COMMIT_SHA: ${{ github.sha }}
    steps:
      - name: Validate tag format
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$TAG' is not a strict semver release tag (vX.Y.Z)"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag is on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$COMMIT_SHA" origin/main || {
            echo "::error::release tags must point to a commit on main"
            exit 1
          }

      - name: Verify version, package.json, and CHANGELOG
        id: version
        run: |
          VERSION="${TAG#v}"
          FILE_VERSION=$(node -p "require('./package.json').version")
          TOP=$(sed -n 's/^## \([^ ]*\).*/\1/p' CHANGELOG.md | head -n 1)
          test "$VERSION" = "$FILE_VERSION" || { echo "::error::tag $TAG does not match package.json version $FILE_VERSION"; exit 1; }
          test "$VERSION" = "$TOP" || { echo "::error::tag $TAG does not match the top CHANGELOG.md heading $TOP"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi

  test:
    name: Tests
    needs: verify
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  build:
    name: Build, checksum, and attest
    needs: [verify, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      COMMIT_SHA: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the package tarball
        run: |
          mkdir dist
          TGZ="dist/dev.manalens.sdk-$VERSION.tgz"
          git archive --format=tar.gz --prefix=package/ -o "$TGZ" "$COMMIT_SHA" -- . \
            ':(exclude)Tests~' ':(exclude).github' ':(exclude).gitignore'
          tar -tzf "$TGZ" | tee "$RUNNER_TEMP/files.txt"
          if grep -E '^package/(Tests~|\.github|\.gitignore)' "$RUNNER_TEMP/files.txt"; then
            echo "::error::the tarball has repo-only files (listed above)"
            exit 1
          fi
          PACKAGE_VERSION=$(tar -xzOf "$TGZ" package/package.json | node -e "process.stdout.write(JSON.parse(require('fs').readFileSync(0, 'utf8')).version)")
          test "$PACKAGE_VERSION" = "$VERSION" || { echo "::error::package/package.json in the tarball is $PACKAGE_VERSION"; exit 1; }

      - name: Write SHA256SUMS and the release notes
        run: |
          (cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)
          awk -v v="$VERSION" '/^## / { if (found) exit; if ($2 == v) { found = 1; next } } found' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          test -s "$RUNNER_TEMP/notes.md" || { echo "::error::CHANGELOG.md has no text under ## $VERSION"; exit 1; }
          mkdir notes && mv "$RUNNER_TEMP/notes.md" notes/notes.md

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tgz

      - name: Upload release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            dist/
            notes/
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create GitHub release
    needs: [verify, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.verify.outputs.version }}
      PRERELEASE: ${{ needs.verify.outputs.prerelease }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release

      - name: Create the release
        run: |
          FLAGS=()
          if [ "$PRERELEASE" = true ]; then FLAGS+=(--prerelease); fi
          gh release create "$TAG" release/dist/* \
            --verify-tag --title "v$VERSION" --notes-file release/notes/notes.md "${FLAGS[@]}"
